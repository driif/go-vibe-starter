version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam

  settings:
    errcheck:
      # a failed Close on a read path, or a failed write to a ResponseWriter whose
      # body is already committed, leaves nothing useful to do with the error
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*os.File).Close
        - (*encoding/json.Encoder).Encode
    gosec:
      excludes:
        # unchecked errors are errcheck's beat; gosec duplicates the finding
        - G104
    staticcheck:
      # golangci-lint's default set, minus one editor-grade quickfix
      checks:
        - all
        - -QF1008
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    gocritic:
      disabled-checks:
        # fires on readable early-return chains that get worse when rewritten
        - ifElseChain
    revive:
      rules:
        - name: context-as-argument
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming

  exclusions:
    generated: lax
    paths:
      - internal/db/gen
      - '.*\.gen\.go$'
    rules:
      # tests trade defensive plumbing for readability
      - path: '_test\.go'
        linters:
          - errcheck
          - gocritic
          - gosec
          - noctx
          - unparam
      # goose.RunContext needs a context this cobra command does not thread through yet
      - path: 'cmd/db_migrate\.go'
        text: 'SA1019'
        linters:
          - staticcheck
      # opening a caller-supplied path is the whole job of the dotenv loader
      - path: 'pkg/dotenv/'
        linters:
          - gosec
      # fixtures and harness helpers run before any request context exists
      - path: 'pkg/tests/|internal/server/test/'
        linters:
          - gocritic
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - internal/db/gen
      - '.*\.gen\.go$'
