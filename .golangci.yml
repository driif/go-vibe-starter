version: "2"

run:
  timeout: 3m
  build-tags:
    - smoke

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - sloglint
    - unconvert
    - unparam

  settings:
    errcheck:
      # a failed Close on a read path, or a failed write to a ResponseWriter whose
      # body is already committed, leaves nothing useful to do with the error
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*github.com/jackc/pgx/v5.Conn).Close
        - (*os.File).Close
        - (*encoding/json.Encoder).Encode
    forbidigo:
      forbid:
        - pattern: '^(fmt\.Print(|f|ln)|print|println)$'
    gosec:
      excludes:
        # unchecked errors are errcheck's beat; gosec duplicates the finding
        - G104
    staticcheck:
      # golangci-lint's default set, minus one editor-grade quickfix
      checks:
        - all
        - -QF1008
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    gocritic:
      disabled-checks:
        # fires on readable early-return chains that get worse when rewritten
        - ifElseChain
    revive:
      rules:
        - name: context-as-argument
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
    sloglint:
      key-naming-case: snake
      no-mixed-args: true

  exclusions:
    generated: lax
    paths:
      - internal/db/gen
      - internal/gen
    rules:
      # tests trade defensive plumbing for readability
      - path: '_test\.go'
        linters:
          - errcheck
          - gocritic
          - gosec
          - noctx
          - unparam
      # opening .env.local in the working directory is the whole job of the parser
      - path: 'internal/server/config/dotenv\.go'
        linters:
          - gosec
      # the management listener serves pprof on purpose
      - path: 'internal/server/management\.go'
        text: 'G108'
        linters:
          - gosec
      # fixtures and harness helpers run before any request context exists
      - path: 'internal/test/|internal/identity/testprovider/'
        linters:
          - gocritic
          - gosec
          - noctx
      # a handler method has the name of its RPC
      - path: 'internal/rpc/'
        text: 'method \w+ should be'
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - internal/db/gen
      - internal/gen
