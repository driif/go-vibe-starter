name: Keycloak smoke
on:
  pull_request:
    paths:
      - 'keycloak/**'
      - 'docker-compose.yaml'
      - 'internal/identity/**'
      - 'internal/server/middleware/auth*.go'
      - 'internal/test/**'
      - '.github/workflows/keycloak.yml'
  push:
    branches: [main]
    paths:
      - 'keycloak/**'
      - 'docker-compose.yaml'
      - 'internal/identity/**'
      - 'internal/server/middleware/auth*.go'
      - 'internal/test/**'
      - '.github/workflows/keycloak.yml'
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make smoke
      - if: failure()
        run: docker compose logs keycloak
